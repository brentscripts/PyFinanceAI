services:
  pyfmgr:
    build:
      context: .
      args:
        DEV_INSTALL: "false"   # Set to "true" to also install pytest etc.
    image: pyfmgr:latest
    ports:
      - "${HOST_PORT}:5000"          # Map host port to container port
    volumes:
      - finance_data:/app/data       # Persist the database across rebuilds
    env_file:
      - .env                         # Load environment variables cleanly
    environment:
      FLASK_ENV: production
      DATABASE: /app/data/finance.db # Lives in the named volume, not the image
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  finance_data:
