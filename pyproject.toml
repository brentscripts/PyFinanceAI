[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmgr"
version = "0.1.0"
description = "Personal finance manager: CSV import, categorization, and a Flask dashboard."
requires-python = ">=3.9"
dependencies = [
    "blinker==1.9.0",
    "click==8.2.1",
    "colorama==0.4.6",
    "Flask==3.1.2",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.2",
    "gunicorn==23.0.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.2",
    "numpy==2.3.2",
    "pandas==2.3.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    "six==1.17.0",
    "tzdata==2025.2",
    "Werkzeug==3.1.3",
    "WTForms==3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
]

[tool.setuptools]
packages = ["database", "importers", "webapp"]
py-modules = ["main", "init_db", "manage_users"]
